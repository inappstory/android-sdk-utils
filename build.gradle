// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '1.9.0'
        utils_connector_version = "5c9b532a64e1d121386c86cfa9989a96eb1d5ec9"
        camerax_version = "1.4.0"
        coroutines_version = "1.6.4"
        core_ktx_version = "1.8.0"
        appcompat_version = "1.5.0"
        material_version = "1.6.1"
        window_version = "1.0.0"
        webkit_version = "1.4.0"
        lifecycle_runtime_ktx_version = "2.4.0"
        exif_version = "1.3.6"
        gradle_version = '8.1.2'
        gradle_plugin_version = "1.8.10"


        inappstory_utils_output_version = "1.0.5"
        inappstory_utils_output_build = 6
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$gradle_plugin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}